<title>內部人才流動與技能分析平台 | Talent Mobility Platform</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0;
  --ink:#1e293b; --muted:#64748b;
  --primary:#2563eb; --primary-weak:#dbeafe; --primary-strong:#1d4ed8;
  --ok:#16a34a; --ok-weak:#dcfce7; --warn:#d97706; --warn-weak:#fef3c7;
  --bad:#dc2626; --bad-weak:#fee2e2; --info:#0284c7; --info-weak:#e0f2fe;
  --dark:#0f172a; --dark-2:#1e293b;
  --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.08),0 8px 24px -12px rgba(15,23,42,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:24px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}

/* ---------- Header ---------- */
header{background:var(--dark);color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.hd-inner{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.3px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.roles,.langs{display:flex;gap:4px;background:var(--dark-2);padding:4px;border-radius:10px;border:1px solid #334155}
.roles button,.langs button{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;color:#cbd5e1;transition:.15s}
.roles button:hover,.langs button:hover{color:#fff}
.roles button.on,.langs button.on{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.4)}

/* ---------- Layout ---------- */
main{max-width:1100px;margin:0 auto;padding:18px 16px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 12px}
.section-title h2{font-size:17px;font-weight:700}
.section-title .hint{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr}}
@media(max-width:520px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* ---------- Stat cards ---------- */
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.stat .num{font-size:24px;font-weight:800;color:var(--primary)}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;transition:.15s;border:1px solid transparent}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-strong)}
.btn-o{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-o:hover{border-color:var(--primary);color:var(--primary)}
.btn-ok{background:var(--ok);color:#fff}
.btn-warn{background:var(--warn);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.b-pending{background:var(--warn-weak);color:var(--warn)}
.b-approved{background:var(--ok-weak);color:var(--ok)}
.b-rejected{background:var(--bad-weak);color:var(--bad)}
.b-interview{background:var(--info-weak);color:var(--info)}
.b-plain{background:#f1f5f9;color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--primary-weak);color:var(--primary-strong);font-size:11px;font-weight:600;margin:2px 3px 2px 0}

/* ---------- Lists ---------- */
.list-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;cursor:pointer}
.list-item .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.list-item .ttl{font-weight:700;font-size:14px}
.list-item .sub{font-size:12px;color:var(--muted);margin-top:3px}
.list-item .desc{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* ---------- Form ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}

/* ---------- Timeline ---------- */
.tl{list-style:none;margin-top:10px}
.tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:6px}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.tl li.done::before{background:var(--ok)}
.tl li.now::before{background:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.15)}
.tl .t-t{font-size:13px;font-weight:600}
.tl .t-d{font-size:12px;color:var(--muted)}

/* ---------- Table ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);background:#f8fafc;font-weight:700}
tr:last-child td{border-bottom:none}

/* ---------- Charts ---------- */
.gauge-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.gauge{position:relative;width:120px;height:120px;flex-shrink:0}
.gauge svg{transform:rotate(-90deg)}
.gauge .gv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--primary)}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:86vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Modal ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:0}
.modal{background:#fff;width:100%;max-width:560px;max-height:84vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px 18px 18px;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
.modal h3{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.modal .x{color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 10px}
.perf{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.perf .p{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px}
.perf .p b{display:block;font-size:15px;margin-top:2px;color:var(--ink)}
.notice{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--info-weak);color:#075985;font-size:12px;line-height:1.5;margin-bottom:12px}
.notice b{display:block}
</style>
</head>

var STATE = null;
function loadState(){
  var raw = null;
  try { raw = localStorage.getItem("talent_platform_v2"); } catch(e){}
  if (raw) {
    try {
      var s = JSON.parse(raw);
      STATE = {
        jobs: (s.jobs && Array.isArray(s.jobs)) ? s.jobs : SEED_JOBS.slice(),
        employees: (s.employees && Array.isArray(s.employees)) ? s.employees : SEED_EMP.slice(),
        certs: (s.certs && Array.isArray(s.certs)) ? s.certs : SEED_CERTS.slice(),
        transfers: (s.transfers && Array.isArray(s.transfers)) ? s.transfers : SEED_TRANSFERS.slice(),
        notices: (s.notices && Array.isArray(s.notices)) ? s.notices : SEED_NOTICES.slice()
      };
    } catch(e){ STATE = null; }
  }
  if (!STATE) {
    STATE = { jobs: SEED_JOBS.slice(), employees: SEED_EMP.slice(), certs: SEED_CERTS.slice(), transfers: SEED_TRANSFERS.slice(), notices: SEED_NOTICES.slice() };
  }
}
function saveState(){
  try { localStorage.setItem("talent_platform_v2", JSON.stringify(STATE)); } catch(e){}
}
function resetState(){
  STATE = { jobs: SEED_JOBS.slice(), employees: SEED_EMP.slice(), certs: SEED_CERTS.slice(), transfers: SEED_TRANSFERS.slice(), notices: SEED_NOTICES.slice() };
  saveState(); render(); toast(t("toastReset"));
}

/* ================= 工具函數 ================= */
function uid(p){ return p + "_" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); }
function fmtDate(ts){ var d=new Date(ts); var p=function(n){return n<10?"0"+n:""+n}; return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(msg){ var el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove("show");},2200); }
function jobById(id){ for(var i=0;i<STATE.jobs.length;i++){ if(STATE.jobs[i].id===id) return STATE.jobs[i]; } return null; }
function empById(id){ for(var i=0;i<STATE.employees.length;i++){ if(STATE.employees[i].id===id) return STATE.employees[i]; } return null; }
function transferById(id){ for(var i=0;i<STATE.transfers.length;i++){ if(STATE.transfers[i].id===id) return STATE.transfers[i]; } return null; }
function certById(id){ for(var i=0;i<STATE.certs.length;i++){ if(STATE.certs[i].empId===id || STATE.certs[i].id===id) return STATE.certs[i]; } return null; }
function empCerts(empId,onlyApproved){ var out=[]; for(var i=0;i<STATE.certs.length;i++){ if(STATE.certs[i].empId===empId && (!onlyApproved || STATE.certs[i].status==="approved")) out.push(STATE.certs[i]); } return out; }
function myTransfers(empId){ var out=[]; for(var i=0;i<STATE.transfers.length;i++){ if(STATE.transfers[i].empId===empId) out.push(STATE.transfers[i]); } return out; }

function matchScore(emp, job){
  if(!emp || !job) return 0;
  var need = job.skills || [];
  if(need.length===0) return 0;
  var hit=0;
  for(var i=0;i<need.length;i++){
    for(var j=0;j<emp.skills.length;j++){
      if(emp.skills[j].n === need[i]){ hit++; break; }
    }
  }
  return Math.round(hit/need.length*100);
}
function skillGaps(emp, job){
  var need = job.skills || [], out=[];
  for(var i=0;i<need.length;i++){
    var has=null;
    for(var j=0;j<emp.skills.length;j++){ if(emp.skills[j].n===need[i]){ has=emp.skills[j]; break; } }
    if(!has) out.push(need[i]);
    else if(has.l<3) out.push(need[i]+"（Basic）");
  }
  return out;
}

function statusBadge(st){
  var map = {
    manager:["b-pending", t("st_manager")], hr:["b-pending", t("st_hr")],
    target:["b-interview", t("st_target")], interview:["b-interview", t("st_interview")],
    approved:["b-approved", t("st_approved")], rejected:["b-rejected", t("st_rejected")], appeal:["b-warn", t("st_appeal")]
  };
  var m = map[st] || ["b-plain",st];
  return '<span class="badge '+m[0]+'">'+m[1]+'</span>';
}
function certBadge(st){
  if(st==="approved") return '<span class="badge b-approved">'+t("cert_approved")+'</span>';

}

/* AI 分析 */
function openAi(jobId){
  var me = EMPLOYEE, job = jobById(jobId);
  if(!job) return;
  var score = matchScore(me, job);
  var gaps = skillGaps(me, job);
  var box = document.getElementById("aiBox");
  var h = '<div style="text-align:left">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center"><b>'+esc(job.title)+'</b><span style="font-size:22px;font-weight:800;color:var(--primary)">'+score+'%</span></div>';
  h += '<div style="font-size:12px;color:var(--muted);margin:4px 0 10px">AI Match Score</div>';
  if(gaps.length===0){ h += '<p style="font-size:13px;color:var(--ok);margin:6px 0">✓ Fully Qualified</p>'; }
  else {
    h += '<div style="font-size:12px;font-weight:700;color:var(--muted)">Gaps:</div><ul style="margin:4px 0 0 18px;font-size:13px">';
    for(var i=0;i<gaps.length;i++){ h += '<li>'+esc(gaps[i])+'</li>'; }
    h += '</ul>';
  }
  h += '</div>';
  box.innerHTML = h;
}

  }

  // 認證審核
  h += '<div class="section-title"><h2>'+t("certReview")+'</h2></div>';
  var pendingCerts = STATE.certs.filter(function(c){return c.status==="pending";});
  if(pendingCerts.length===0){ h += '<div class="card empty">N/A</div>'; }
  for(var c=0;c<pendingCerts.length;c++){
    var cert = pendingCerts[c]; var emp = empById(cert.empId);
    h += '<div class="list-item" style="cursor:default"><div class="row"><div><span class="ttl">'+esc(cert.name)+'</span></div>'+certBadge(cert.status)+'</div>';
    h += '<div class="sub">'+esc(emp?emp.name:cert.empId)+' ｜ '+esc(cert.issuer)+'</div>';
    h += '<div class="actions"><button class="btn btn-ok btn-sm" onclick="certDecision(\''+cert.id+'\',true)">'+t("certApprove")+'</button><button class="btn btn-bad btn-sm" onclick="certDecision(\''+cert.id+'\',false)">'+t("rejectBtn")+'</button></div></div>';
  }
  return h;
}
function pendingCount(st){ var n=0; for(var i=0;i<STATE.transfers.length;i++){ if(STATE.transfers[i].status===st) n++; } return n; }

function managerDecision(id, ok){
  var tItem = transferById(id); if(!tItem) return;
  if(ok){
    tItem.status = "hr";
    tItem.timeline.push({ s:"Manager Approved", t:Date.now(), d:"Approved by Manager" });
    saveState(); render(); toast("Approved");
  } else {
    tItem.status = "rejected";
    tItem.timeline.push({ s:"Manager Rejected", t:Date.now(), d:"Rejected by Manager" });
    saveState(); render(); toast("Rejected");
  }
}
function certDecision(id, ok){
  var cert = certById(id); if(!cert) return;
  cert.status = ok ? "approved" : "rejected";
  saveState(); render(); toast("Updated");
}

/* ================= 人事部視圖 ================= */
function viewHR(){
  var h = "";
  h += '<div class="grid grid-4">';
  h += '<div class="stat"><div class="num">'+pendingCount("hr")+'</div><div class="lbl">'+t("hrPending")+'</div></div>';
  h += '<div class="stat"><div class="num">'+pendingCount("target")+'</div><div class="lbl">'+t("hrTarget")+'</div></div>';
  h += '<div class="stat"><div class="num">'+pendingCount("interview")+'</div><div class="lbl">'+t("hrInterview")+'</div></div>';
  h += '<div class="stat"><div class="num">'+pendingCount("appeal")+'</div><div class="lbl">'+t("hrAppeal")+'</div></div>';
  h += '</div>';

  h += '<div class="card" style="margin-top:14px"><h3>'+t("perfModule")+'</h3>';
  h += '<div class="notice"><div>'+t("perfDesc")+'</div></div></div>';

  // 待終審
  h += '<div class="section-title"><h2>'+t("hrPending")+'</h2></div>';
  var hrPending = STATE.transfers.filter(function(tItem){return tItem.status==="hr";});
  if(hrPending.length===0){ h += '<div class="card empty">N/A</div>'; }
  for(var i=0;i<hrPending.length;i++){
    var tItem = hrPending[i]; var job = jobById(tItem.targetJobId);
    h += '<div class="list-item" style="cursor:default"><div class="row"><div><span class="ttl">'+esc(tItem.empName)+'</span></div>'+statusBadge(tItem.status)+'</div>';
    h += '<div class="sub">'+esc(job?job.title:"-")+'</div>';
    h += '<div class="perf"><div class="p">Rating <b>'+tItem.perf.rating+'</b></div><div class="p">KPI <b>'+tItem.perf.kpi+'%</b></div></div>';
    h += '<div class="actions"><button class="btn btn-ok btn-sm" onclick="hrDecision(\''+tItem.id+'\',true)">'+t("hrApprove")+'</button><button class="btn btn-bad btn-sm" onclick="hrDecision(\''+tItem.id+'\',false)">'+t("hrReject")+'</button></div></div>';
  }

  // 申訴覆核
  h += '<div class="section-title"><h2>'+t("appealReview")+'</h2></div>';
  var appeals = STATE.transfers.filter(function(tItem){return tItem.status==="appeal";});
  if(appeals.length===0){ h += '<div class="card empty">N/A</div>'; }
  for(var a=0;a<appeals.length;a++){
    var ap = appeals[a];
    h += '<div class="list-item" style="cursor:default"><div class="row"><div><span class="ttl">'+esc(ap.empName)+'</span></div>'+statusBadge(ap.status)+'</div>';
    h += '<div class="desc">'+esc(ap.appealText || "-")+'</div>';
    h += '<div class="actions"><button class="btn btn-ok btn-sm" onclick="hrAppealDecision(\''+ap.id+'\',true)">'+t("appealAccept")+'</button><button class="btn btn-bad btn-sm" onclick="hrAppealDecision(\''+ap.id+'\',false)">'+t("appealKeep")+'</button></div></div>';
  }
  return h;
}

function hrDecision(id, ok){
  var tItem = transferById(id); if(!tItem) return;
  tItem.status = ok ? "target" : "rejected";
  tItem.timeline.push({ s: ok?"HR Passed":"HR Rejected", t:Date.now(), d:"" });
  saveState(); render(); toast("Updated");
}
function hrAppealDecision(id, accept){
  var tItem = transferById(id); if(!tItem) return;
  tItem.status = accept ? "manager" : "rejected";
  tItem.timeline.push({ s: accept?"Appeal Accepted":"Appeal Denied", t:Date.now(), d:"" });
  saveState(); render(); toast("Updated");
}

/* ================= 系統管理員視圖 ================= */
function viewAdmin(){
  var h = "";
  h += '<div class="section-title"><h2>'+t("adminTitle")+'</h2></div>';
  h += '<div class="card">';
  h += '<h3>'+t("dataMgmt")+'</h3><p style="font-size:13px;color:var(--muted);margin-bottom:12px">'+t("dataDesc")+'</p>';
  h += '<button class="btn btn-warn btn-sm" onclick="resetState()">'+t("resetData")+'</button>';
  h += '</div>';

  h += '<div class="card">';
  h += '<h3>'+t("jobMgmt")+'</h3>';
  h += '<button class="btn btn-p btn-sm" onclick="openJobForm()">'+t("newJob")+'</button>';
  h += '<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>'+t("colTitle")+'</th><th>'+t("colDept")+'</th><th>'+t("colType")+'</th><th>'+t("colCount")+'</th><th>'+t("colStatus")+'</th><th>'+t("colAction")+'</th></tr></thead><tbody>';
  for(var i=0;i<STATE.jobs.length;i++){
    var j = STATE.jobs[i];
    h += '<tr><td><b>'+esc(j.title)+'</b></td><td>'+esc(j.dept)+'</td><td>'+(j.type==="full"?t("fullTime"):t("microProject"))+'</td><td>'+j.headcount+'</td><td><span class="badge '+(j.status==="open"?"b-approved":"b-plain")+'">'+j.status+'</span></td>';
    h += '<td><button class="btn btn-o btn-sm" onclick="toggleJobStatus(\''+j.id+'\')">Toggle</button></td></tr>';
  }
  h += '</tbody></table></div></div>';
  return h;
}

function openJobForm(){
  var opts = "";
  for(var i=0;i<DEPTS.length;i++){ opts += '<option value="'+DEPTS[i]+'">'+DEPTS[i]+'</option>'; }
  showModal(t("newJob"),
    '<div class="field"><label>'+t("jobTitleLabel")+'</label><input id="jTitle"></div>'+
    '<div class="field"><label>'+t("jobDeptLabel")+'</label><select id="jDept">'+opts+'</select></div>'+
    '<div class="field"><label>'+t("jobTypeLabel")+'</label><select id="jType"><option value="full">Full-time</option><option value="micro">Micro-project</option></select></div>'+
    '<div class="field"><label>'+t("jobCountLabel")+'</label><input id="jCount" type="number" value="1"></div>'+
    '<div class="field"><label>'+t("jobSkillsLabel")+'</label><input id="jSkills"></div>'+
    '<button class="btn btn-p" style="width:100%" onclick="submitJob()">'+t("submitJob")+'</button>');
}
function submitJob(){
  var title = document.getElementById("jTitle").value.trim();
  var dept = document.getElementById("jDept").value;
  var type = document.getElementById("jType").value;
  var count = parseInt(document.getElementById("jCount").value,10)||1;
  var rawSkills = document.getElementById("jSkills").value.split(/[,，]/);
  var skills = [];
  for(var i=0;i<rawSkills.length;i++){ if(rawSkills[i].trim()) skills.push(rawSkills[i].trim()); }
  if(!title){ toast("Please enter title"); return; }
  STATE.jobs.unshift({ id: uid("J"), title:title, dept:dept, type:type, headcount:count, skills:skills, status:"open" });
  saveState(); closeModal(); render(); toast("Job created");
}
function toggleJobStatus(id){
  var j = jobById(id); if(!j) return;
  j.status = (j.status==="open") ? "closed" : "open";
  saveState(); render(); toast("Status updated");
}

/* 初始化 */
loadState();
switchLang("zh-Hant");
</script>
